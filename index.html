<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematik - Biblioteca de Recursos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .header-bg {
            background: linear-gradient(90deg, #1e3a8a 0%, #1d4ed8 100%);
        }
        /* Estilos para el Visor Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.8);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 1000px;
            height: 90%;
            display: flex;
            flex-direction: column;
        }
        .pdf-canvas-container {
            flex-grow: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            padding-top: 10px; /* Pequeño espacio para que el canvas no toque el borde */
        }
        #pdf-viewer {
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            max-width: 100%; 
            height: auto;
        }
    </style>
    <!-- Carga del visor de PDF (CDN de Mozilla) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.js"></script>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Encabezado (Header) -->
    <header class="header-bg text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-3xl font-bold tracking-tight">Matematik</h1>
            <button id="login-button" class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-300">
                Iniciar Sesión
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <section class="text-center mb-16">
            <h2 class="text-5xl font-extrabold text-gray-900 mb-4">
                El futuro del aprendizaje de matemáticas.
            </h2>
            <p class="text-xl text-gray-600 max-w-3xl mx-auto">
                Accede a nuestra colección completa de 27 recursos esenciales.
            </p>
        </section>

        <!-- Sección de Recursos de Estudio (Lista dinámica) -->
        <section class="bg-white p-8 rounded-xl card mb-16">
            <h2 class="text-3xl font-bold text-gray-900 mb-6">Biblioteca Completa de 27 PDFs</h2>
            
            <!-- Aquí se insertarán los 27 elementos dinámicamente -->
            <div id="content-list" class="space-y-3">
                <!-- Se rellena con JavaScript -->
                <div class="text-center text-gray-500 py-10" id="loading-message">Cargando lista de recursos...</div>
            </div>
            
        </section>

    </main>

    <!-- Modal para el Visor de PDF -->
    <div id="pdf-modal" class="modal">
        <div class="modal-content">
            <div class="flex flex-col sm:flex-row justify-between items-center pb-4 border-b border-gray-200 space-y-2 sm:space-y-0">
                <h3 id="pdf-title" class="text-xl font-bold text-gray-800 text-center sm:text-left">Cargando Documento...</h3>
                <button id="close-modal" class="text-gray-500 hover:text-gray-700 text-2xl font-bold transition duration-150">&times;</button>
            </div>
            <!-- Contenedor del PDF (Canvas) -->
            <div class="pdf-canvas-container">
                <canvas id="pdf-viewer"></canvas>
            </div>
            <!-- Controles del Visor y Descarga -->
            <div class="mt-4 flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0 sm:space-x-4">
                <!-- Sección de Navegación -->
                <div class="flex space-x-4">
                    <button id="prev-page" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition duration-300">Anterior</button>
                    <span id="page-info" class="font-medium text-gray-700 self-center">Página 0 de 0</span>
                    <button id="next-page" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition duration-300">Siguiente</button>
                </div>
                <!-- Sección de Descarga -->
                <a id="download-link" href="#" target="_blank" download class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 11.586V4a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                    Descargar PDF
                </a>
            </div>
        </div>
    </div>

    <!-- Pie de Página (Footer) -->
    <footer class="bg-gray-800 text-white mt-12 py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p>&copy; 2024 Matematik. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        // =========================================================================
        // 1. LISTA COMPLETA DE 27 RECURSOS (EXTRAÍDOS DE LA IMAGEN)
        // La ruta 'pdfs/' se añade automáticamente a cada archivo, excepto a prueba.pdf.
        // =========================================================================
        const rawPdfNames = [
            "CIUDAD GEOMÉTRICA.pdf",
            "DON PORCENTAJE.pdf",
            "ECUACIÓN PERFECTA DEL AMOR.pdf",
            "EL CERO Y SU TRISTEZA.pdf",
            "EL CUBO SOÑADOR.pdf",
            "EL ENREDO DE LOS CEROS.pdf",
            "EL ORIGEN DEL ÁLGEBRA.pdf",
            "EL TALLER DE NACHO.pdf",
            "EL SEÑOR MIXTO SE CONVIERTE EN UNA FRACCIÓN.pdf",
            "EL UNO ROJO Y EL NUEVE MALO.pdf",
            "EL VIAJE DE LA AVENTURAN GEOMÉTRICA.pdf",
            "LA AVENTURA MATEMÁTICA DE CENICIENTA.pdf",
            "La carrera de las funciones.pdf",
            "La fiesta del Seno y del Coseno.pdf",
            "LA GRAN IMPORTANCIA DE LOS NÚMEROS EN EL FÚTBOL.pdf",
            "LA LOCURA DEL UNO.pdf",
            "LA REBELIÓN DE LOS NÚMEROS.pdf",
            "LAS MATEMÁTICAS DEL AMOR.pdf",
            "LAS MATEMÁTICAS UN MUNDO POR CONOCER.pdf",
            "Los tres ceritos y la incógnita feroz.pdf",
            "PARTE ENTERA.pdf",
            "POEMA MATEMATICO.pdf",
            "QUIÉN ES EL MEJOR.pdf",
            "RAIZ CUADRADA.pdf",
            "UNA GRAN FAMILIA NUMÉRICA.pdf",
            "VECTOR NULO.pdf",
            "Ecuaciones del corazón.pdf"
        ];

        // Mapeo la lista de nombres de archivo a objetos con título y ruta
        const pdfList = rawPdfNames.map(name => {
            // Elimina la extensión .pdf y convierte a minúsculas para el título amigable
            const baseTitle = name.replace(/\.pdf$/i, '').toUpperCase();
            
            // Asume que todos están en la carpeta 'pdfs/', excepto el archivo de prueba si lo tienes aparte.
            const filename = 'pdfs/' + name; 

            return { title: baseTitle, filename: filename };
        });

        // Opcional: Si quieres mantener el archivo de prueba original en la raíz, puedes añadirlo aquí
        // pdfList.unshift({ title: "DOCUMENTO DE PRUEBA (RAÍZ)", filename: "prueba.pdf" });


        // =========================================================================
        // 2. LÓGICA DEL VISOR DE PDF
        // =========================================================================
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.js';

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        const scale = 2.5; // Resolución alta para nitidez (lo que soluciona el problema de "borroso")
        const canvas = document.getElementById('pdf-viewer');
        const ctx = canvas.getContext('2d');
        const pdfModal = document.getElementById('pdf-modal');
        const pdfTitle = document.getElementById('pdf-title');
        const pageInfo = document.getElementById('page-info');
        const downloadLink = document.getElementById('download-link');

        function renderPage(num) {
            pageRendering = true;

            pdfDoc.getPage(num).then(function(page) {
                // Ajuste de escala para mejor visualización manteniendo alta calidad
                const containerWidth = document.querySelector('.modal-content').clientWidth - 40; 
                let adjustedScale = scale;
                
                const initialViewport = page.getViewport({ scale: 1 });
                if (initialViewport.width * scale > containerWidth) {
                    adjustedScale = containerWidth / initialViewport.width;
                }
                
                const viewport = page.getViewport({ scale: adjustedScale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = { canvasContext: ctx, viewport: viewport };
                const renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        queueRenderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });

                pageInfo.textContent = 'Página ' + num + ' de ' + pdfDoc.numPages;
            });
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        document.getElementById('prev-page').addEventListener('click', function() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        });

        document.getElementById('next-page').addEventListener('click', function() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        });

        function openPdfViewer(url, title, filename) {
            pdfTitle.textContent = "Cargando: " + title + "...";
            pageInfo.textContent = 'Página 0 de 0';
            pdfModal.style.display = 'flex'; 
            
            // Configura el enlace de descarga (usando la URL relativa)
            downloadLink.href = url;
            downloadLink.setAttribute('download', filename.split('/').pop()); // Usar solo el nombre del archivo

            pdfjsLib.getDocument(url).promise.then(function(pdfDocument) {
                pdfDoc = pdfDocument;
                pageNum = 1; 
                pdfTitle.textContent = title; 
                renderPage(pageNum);
            }).catch(function(error) {
                pdfTitle.textContent = "Error al cargar el PDF. Verifica que el archivo '" + filename + "' exista en la ruta correcta (¿está en la carpeta pdfs/?)";
                console.error("Error al cargar el PDF: ", error);
            });
        }

        document.getElementById('close-modal').addEventListener('click', function() {
            pdfModal.style.display = 'none';
        });

        window.addEventListener('click', function(event) {
            if (event.target === pdfModal) {
                pdfModal.style.display = 'none';
            }
        });

        // =========================================================================
        // 3. GENERACIÓN DINÁMICA DE LA LISTA
        // =========================================================================
        function generatePdfList() {
            const listContainer = document.getElementById('content-list');
            listContainer.innerHTML = ''; // Limpia el mensaje de carga

            if (pdfList.length === 0) {
                listContainer.innerHTML = '<p class="text-gray-500 text-center">No hay recursos disponibles.</p>';
                return;
            }

            pdfList.forEach((pdf, index) => {
                const element = document.createElement('div');
                element.className = 'p-4 bg-blue-50 border border-blue-200 rounded-lg flex justify-between items-center cursor-pointer hover:bg-blue-100 transition duration-150 view-pdf';
                
                element.innerHTML = `
                    <span class="font-medium text-blue-800">${index + 1}. ${pdf.title}</span>
                    <span class="text-sm text-blue-600 font-semibold py-1 px-3 bg-blue-200 rounded-full">Abrir PDF</span>
                `;

                // Añadir evento de click
                element.addEventListener('click', () => {
                    openPdfViewer(pdf.filename, pdf.title, pdf.filename);
                });

                listContainer.appendChild(element);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            generatePdfList(); // Genera la lista al cargar la página

            document.getElementById('login-button').addEventListener('click', () => {
                // Mensaje de alerta para funcionalidad estática
                const customAlert = document.createElement('div');
                customAlert.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center';
                customAlert.innerHTML = `
                    <div class="bg-white p-6 rounded-lg shadow-xl text-center max-w-sm">
                        <p class="text-lg font-semibold mb-4">Funcionalidad Estática</p>
                        <p class="text-gray-600 mb-6">El botón "Iniciar Sesión" es solo un marcador de posición en esta versión. ¡Clic en Iniciar Sesión!</p>
                        <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300" onclick="this.closest('.fixed').remove()">Cerrar</button>
                    </div>
                `;
                document.body.appendChild(customAlert);
            });
        });
    </script>
</body>
</html>
