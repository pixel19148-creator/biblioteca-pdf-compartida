<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Matemática - Cuentos Digitales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                        'outfit': ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        darkbg: '#09090b', // Negro profundo elegante
                        darkcard: '#18181b', // Gris muy oscuro para tarjetas
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Patrón de puntos sutil para el fondo (Estilo Matemático/Tech) */
        .bg-pattern {
            background-image: radial-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark .bg-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        h1, h2, h3, .font-space {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Scrollbar elegante */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Loader Minimalista */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(14, 165, 233, 0.2);
            border-top-color: #0ea5e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .dark .spinner {
            border: 3px solid rgba(34, 211, 238, 0.1);
            border-top-color: #22d3ee;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-darkbg dark:text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden antialiased bg-pattern">

    <!-- BOTÓN DE TEMA CLARO/OSCURO (Minimalista) -->
    <button id="themeToggle" class="fixed top-5 right-5 z-[110] p-3 rounded-full bg-white dark:bg-darkcard border border-slate-200 dark:border-white/10 shadow-sm hover:shadow-md dark:hover:shadow-[0_0_15px_rgba(255,255,255,0.05)] hover:scale-105 transition-all duration-300 group cursor-pointer" title="Cambiar Tema">
        <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-500 hidden dark:block group-hover:rotate-45 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500 block dark:hidden group-hover:-rotate-12 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
    </button>

    <!-- Modal para el visor de PDF -->
    <div id="pdfModal" class="fixed inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-sm hidden z-[100] overflow-y-auto transition-opacity duration-300">
        <div class="flex flex-col h-full w-full mx-auto relative max-w-7xl shadow-2xl bg-slate-50 dark:bg-darkbg">
            
            <!-- Barra de Título y Cierre del PDF -->
            <div class="p-4 sm:p-5 flex justify-between items-center sticky top-0 z-50 bg-white/90 dark:bg-darkcard/90 backdrop-blur-md border-b border-slate-200 dark:border-white/10">
                <div class="flex items-center gap-3 max-w-[60%] sm:max-w-[70%]">
                    <div class="w-1.5 h-6 bg-blue-500 dark:bg-cyan-400 rounded-full hidden sm:block"></div>
                    <div class="text-sm sm:text-lg font-space font-semibold truncate text-slate-800 dark:text-slate-200" id="modalTitle"></div>
                </div>
                
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <span id="pageInfo" class="text-xs sm:text-sm font-space text-slate-500 dark:text-slate-400 hidden sm:block tracking-widest uppercase">
                        Pág <span id="currentPage" class="text-slate-900 dark:text-white font-bold">0</span> / <span id="totalPages">0</span>
                    </span>
                    
                    <button id="downloadPdf" class="px-4 py-2 bg-blue-50 dark:bg-white/5 hover:bg-blue-100 dark:hover:bg-white/10 border border-blue-100 dark:border-white/10 rounded-lg text-blue-600 dark:text-slate-300 text-xs sm:text-sm font-space transition-colors flex items-center space-x-2" title="Descargar Archivo">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        <span class="hidden sm:inline">Descargar</span>
                    </button>
                    
                    <button id="closeModal" class="p-2 bg-red-50 dark:bg-red-500/10 hover:bg-red-100 dark:hover:bg-red-500/20 text-red-500 dark:text-red-400 rounded-lg transition-colors" title="Cerrar">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Controles Mobile -->
            <div class="sm:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-darkcard p-3 flex justify-between items-center px-6 z-50 border-t border-slate-200 dark:border-white/10">
                <button id="prevPageMobile" class="p-2 bg-slate-100 dark:bg-white/5 rounded-lg text-slate-700 dark:text-slate-300 active:bg-slate-200 dark:active:bg-white/10 disabled:opacity-30 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <span class="font-space text-slate-500 dark:text-slate-400 tracking-widest text-xs uppercase">
                    <span id="currentPageMobile" class="text-slate-900 dark:text-white text-base font-bold">0</span> / <span id="totalPagesMobile">0</span>
                </span>
                <button id="nextPageMobile" class="p-2 bg-slate-100 dark:bg-white/5 rounded-lg text-slate-700 dark:text-slate-300 active:bg-slate-200 dark:active:bg-white/10 disabled:opacity-30 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                </button>
            </div>
            
            <!-- Controles Desktop -->
            <div class="hidden sm:flex fixed top-1/2 left-0 right-0 justify-between transform -translate-y-1/2 z-50 pointer-events-none px-6 xl:px-12">
                <button id="prevPageDesktop" class="p-3 bg-white/90 dark:bg-darkcard/90 border border-slate-200 dark:border-white/10 backdrop-blur-sm rounded-xl hover:bg-slate-50 dark:hover:bg-white/5 text-slate-700 dark:text-slate-300 transition-all pointer-events-auto disabled:opacity-0 shadow-sm hover:shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <button id="nextPageDesktop" class="p-3 bg-white/90 dark:bg-darkcard/90 border border-slate-200 dark:border-white/10 backdrop-blur-sm rounded-xl hover:bg-slate-50 dark:hover:bg-white/5 text-slate-700 dark:text-slate-300 transition-all pointer-events-auto disabled:opacity-0 shadow-sm hover:shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                </button>
            </div>
            
            <!-- Contenedor PDF -->
            <div class="flex-grow p-4 sm:p-8 overflow-y-auto relative flex justify-center items-start sm:pb-8 pb-24 bg-slate-100/50 dark:bg-black/20"> 
                <canvas id="pdfCanvas" class="max-w-full relative z-10 shadow-lg dark:shadow-2xl dark:shadow-black/50 rounded-sm"></canvas>
                
                <div id="statusMessage" class="absolute inset-0 flex flex-col justify-center items-center p-8 hidden z-20">
                    <div id="loaderSpinner" class="spinner hidden"></div>
                    <p id="statusText" class="font-space text-lg text-slate-600 dark:text-slate-400 mt-6 tracking-widest uppercase text-center"></p>
                    <button id="retryButton" class="mt-6 px-6 py-2 border border-slate-300 dark:border-white/20 rounded-lg font-space hover:bg-slate-200 dark:hover:bg-white/10 transition-colors hidden">
                        Reintentar
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Contenido Principal -->
    <div class="container mx-auto p-4 sm:p-8 flex-grow relative z-10 max-w-7xl">
        
        <!-- HEADER LIMPIO Y ELEGANTE -->
        <header class="text-center mb-16 pt-12">
            <div class="inline-block relative w-full max-w-3xl">
                <div class="px-6 py-10 sm:py-14 rounded-3xl bg-white dark:bg-darkcard border border-slate-200 dark:border-white/5 shadow-xl shadow-slate-200/50 dark:shadow-none">
                    <h1 class="text-4xl sm:text-5xl md:text-6xl font-space font-bold tracking-tight leading-tight">
                        <span class="block text-slate-500 dark:text-slate-400 text-lg sm:text-xl mb-3 font-medium tracking-[0.2em] uppercase">Biblioteca de</span>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-teal-500 dark:from-cyan-400 dark:to-emerald-400">
                            Cuentos Matemáticos
                        </span>
                    </h1>
                    <div class="h-1 w-16 bg-gradient-to-r from-blue-500 to-teal-400 dark:from-cyan-500 dark:to-emerald-500 mx-auto mt-6 rounded-full opacity-80"></div>
                    <p class="mt-6 text-slate-600 dark:text-slate-400 font-light text-base sm:text-lg max-w-xl mx-auto leading-relaxed">
                        Aprende matemáticas a través de historias fascinantes. Selecciona un documento para iniciar la lectura interactiva.
                    </p>
                </div>
            </div>
        </header>

        <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="grid-container">
            <!-- Cards generadas por JS -->
        </main>

    </div>

    <footer class="text-center py-8 mt-auto border-t border-slate-200 dark:border-white/5 bg-white/50 dark:bg-darkbg/50 backdrop-blur-sm relative z-10">
        <p class="text-slate-500 dark:text-slate-500 font-space text-xs tracking-widest uppercase flex items-center justify-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-teal-500 dark:bg-emerald-500"></span>
            Sistema Educativo &copy; 2026 | Interfaz Premium
        </p>
    </footer>

    <script>
        // --- LÓGICA DE TEMA CLARO / OSCURO ---
        const htmlElement = document.documentElement;
        const themeToggleBtn = document.getElementById('themeToggle');

        function applyTheme(theme) {
            if (theme === 'dark') {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            applyTheme('dark');
        } else {
            applyTheme('light');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                applyTheme('light');
            } else {
                applyTheme('dark');
            }
        });

        // --- LÓGICA DE LA BIBLIOTECA PDF ---
        const pdfModal = document.getElementById('pdfModal');
        const pdfCanvas = document.getElementById('pdfCanvas');
        const modalTitle = document.getElementById('modalTitle');
        const statusMessage = document.getElementById('statusMessage');
        const statusText = document.getElementById('statusText');
        const loaderSpinner = document.getElementById('loaderSpinner');
        const retryButton = document.getElementById('retryButton');
        const prevPageDesktop = document.getElementById('prevPageDesktop');
        const nextPageDesktop = document.getElementById('nextPageDesktop');
        const prevPageMobile = document.getElementById('prevPageMobile');
        const nextPageMobile = document.getElementById('nextPageMobile');
        const currentPageSpan = document.getElementById('currentPage');
        const totalPagesSpan = document.getElementById('totalPages');
        const currentPageMobile = document.getElementById('currentPageMobile');
        const totalPagesMobile = document.getElementById('totalPagesMobile');
        const downloadPdfButton = document.getElementById('downloadPdf');
        const gridContainer = document.getElementById('grid-container');
        
        let pdfDoc = null;
        let pageNum = 1;
        let pdfUrl = '';
        let currentTitle = '';

        const rawFiles = [
            "DON PORCENTAJE.pdf",
            "ECUACIÓN PERFECTA DEL AMOR.pdf",
            "Ecuaciones del corazón.pdf",
            "EL CERO Y SU TRISTEZA.pdf",
            "El círculo que perdió su centro.pdf",
            "EL CUBO SOÑADOR.pdf",
            "EL ENREDO DE LOS CEROS.pdf",
            "El mundo detrás del cuaderno.pdf",
            "EL NACIMIENTO DE LAS IDEAS MATEMÁTICAS.pdf",
            "El número que quería brillar.pdf",
            "EL ORIGEN DEL ÁLGEBRA.pdf",
            "El secreto del número 7.pdf",
            "EL SEÑOR MIXTO SE CONVIERTE EN UNA FRACCIÓN.pdf",
            "EL TALLER DE NACHO.pdf",
            "EL UNO ROJO Y EL NUEVE MALO.pdf",
            "El viaje de la aventuran geométrica.pdf",
            "LA AVENTURA MATEMÁTICA DE CENICIENTA.pdf",
            "La carrera de las funciones.pdf",
            "La fiesta del Seno y del Coseno.pdf",
            "LA GRAN IMPORTANCIA DE LOS NÚMEROS EN EL FUTBOL.pdf",
            "LA LOCURA DEL UNO.pdf",
            "LA REBELIÓN DE LOS NÚMEROS.pdf",
            "LAS MATEMÁTICAS DEL AMOR.pdf",
            "Los tres ceritos y la incógnita feroz.pdf"
        ];

        const documents = rawFiles.map(filename => ({
            title: filename.replace('.pdf', ''), 
            file: `pdfs/${filename}` 
        }));

        function renderDocumentButtons() {
            gridContainer.innerHTML = ''; 
            documents.forEach((doc, index) => {
                const button = document.createElement('button');
                // Estilos de la tarjeta bien limpios y modernos
                button.className = `group flex flex-col h-full bg-white dark:bg-darkcard border border-slate-200 dark:border-white/5 rounded-2xl p-6 sm:p-7 text-left cursor-pointer transition-all duration-300 hover:-translate-y-1.5 hover:shadow-xl dark:hover:shadow-[0_8px_30px_rgba(0,0,0,0.5)] dark:hover:bg-[#1f1f22] dark:hover:border-white/10`;

                button.innerHTML = `
                    <div class="flex items-start space-x-4 mb-4">
                        <div class="p-3 bg-blue-50 dark:bg-white/5 rounded-xl text-blue-500 dark:text-cyan-400 group-hover:scale-110 group-hover:bg-blue-100 dark:group-hover:bg-cyan-500/10 transition-transform duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                            </svg>
                        </div>
                        <h2 class="text-base sm:text-lg font-space font-semibold text-slate-800 dark:text-slate-200 leading-snug group-hover:text-blue-600 dark:group-hover:text-cyan-400 transition-colors">
                            ${doc.title}
                        </h2>
                    </div>
                    <div class="mt-auto pt-4 border-t border-slate-100 dark:border-white/5 flex items-center justify-between">
                        <span class="text-[10px] font-space tracking-[0.15em] text-teal-600 dark:text-emerald-500 uppercase font-bold">Documento .PDF</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 dark:text-slate-500 transform -rotate-45 group-hover:text-blue-500 dark:group-hover:text-cyan-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </div>
                `;
                button.onclick = () => openPdfViewer(encodeURI(doc.file), doc.title);
                gridContainer.appendChild(button);
            });
        }

        function showStatus(text, showRetry = false, showLoader = false) {
            statusText.textContent = text;
            retryButton.classList.toggle('hidden', !showRetry);
            loaderSpinner.classList.toggle('hidden', !showLoader);
            statusMessage.classList.remove('hidden');
            pdfCanvas.classList.add('opacity-0'); 
        }

        function hideStatus() {
            statusMessage.classList.add('hidden');
            pdfCanvas.classList.remove('opacity-0');
            pdfCanvas.classList.add('transition-opacity', 'duration-500', 'opacity-100');
        }

        async function openPdfViewer(url, title) {
            pdfUrl = url;
            currentTitle = title;
            modalTitle.textContent = title;
            pdfModal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            pageNum = 1;
            pdfDoc = null;
            
            window.history.pushState({ pdfOpen: true }, '', '#viewer'); 

            await renderPdf(url);

            downloadPdfButton.onclick = () => {
                const link = document.createElement('a');
                link.href = pdfUrl;
                link.download = currentTitle + '.pdf'; 
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
        }

        function closeModal() {
            if (pdfModal.classList.contains('hidden')) return; 

            pdfModal.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
            pdfDoc = null; 
            const ctx = pdfCanvas.getContext('2d');
            if(ctx) ctx.clearRect(0, 0, pdfCanvas.width, pdfCanvas.height); 
            
            if (location.hash === '#viewer') {
                window.history.back();
            }
        }

        async function renderPdf(url) {
            showStatus('Cargando documento...', false, true); 
            try {
                if (!pdfDoc) {
                    const loadingTask = pdfjsLib.getDocument(url);
                    pdfDoc = await loadingTask.promise;
                    totalPagesSpan.textContent = pdfDoc.numPages;
                    totalPagesMobile.textContent = pdfDoc.numPages;
                }
                
                const page = await pdfDoc.getPage(pageNum);
                
                const viewport = page.getViewport({ scale: 1 });
                const modalContainer = pdfCanvas.parentElement;
                
                let scale = (modalContainer.clientWidth * 0.95) / viewport.width;
                if (scale * viewport.height > modalContainer.clientHeight * 0.9) {
                     scale = (modalContainer.clientHeight * 0.9) / viewport.height;
                }
                scale = Math.max(0.6, scale); 

                const finalViewport = page.getViewport({ scale: scale });

                pdfCanvas.height = finalViewport.height;
                pdfCanvas.width = finalViewport.width;

                const renderContext = {
                    canvasContext: pdfCanvas.getContext('2d'),
                    viewport: finalViewport
                };
                
                await page.render(renderContext).promise;
                
                currentPageSpan.textContent = pageNum;
                currentPageMobile.textContent = pageNum;

                hideStatus();
                updatePagingButtons();

            } catch (error) {
                console.error('Error del sistema:', error);
                showStatus(`Archivo no encontrado (${currentTitle}.pdf)`, true, false);
            }
        }

        function updatePagingButtons() {
            const isFirst = pageNum <= 1;
            const isLast = pdfDoc && pageNum >= pdfDoc.numPages;

            prevPageDesktop.disabled = isFirst;
            nextPageDesktop.disabled = isLast;
            prevPageMobile.disabled = isFirst;
            nextPageMobile.disabled = isLast;
        }

        function goToPage(delta) {
            if (!pdfDoc) return;
            const newPageNum = pageNum + delta;

            if (newPageNum >= 1 && newPageNum <= pdfDoc.numPages) {
                pageNum = newPageNum;
                renderPdf(pdfUrl);
            }
        }

        // Inicialización y Eventos
        window.onload = renderDocumentButtons;

        document.getElementById('closeModal').onclick = closeModal;
        retryButton.onclick = () => renderPdf(pdfUrl);
        prevPageDesktop.onclick = () => goToPage(-1);
        nextPageDesktop.onclick = () => goToPage(1);
        prevPageMobile.onclick = () => goToPage(-1);
        nextPageMobile.onclick = () => goToPage(1);

        document.addEventListener('keydown', (e) => {
            if (!pdfModal.classList.contains('hidden')) {
                if (e.key === 'Escape') closeModal();
                else if (e.key === 'ArrowLeft') goToPage(-1);
                else if (e.key === 'ArrowRight') goToPage(1);
            }
        });
        
        window.addEventListener('resize', () => {
            if (pdfDoc && !pdfModal.classList.contains('hidden')) renderPdf(pdfUrl);
        });
        
        window.addEventListener('popstate', (event) => {
            if (!pdfModal.classList.contains('hidden')) {
                closeModal();
            }
        });

    </script>
</body>
</html>
